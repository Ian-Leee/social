<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <style>
    .bg-block {
      transition: left 0.5s;
    }
  </style>
</head>
<body>

<section class="menu fixed w-full h-screen top-2.2 hidden">

  <!-- background -->
  <div class="absolute top-2.2 z-[50] h-full w-full">
      <!-- 五個橘色色塊，依次出現 --> 
      <div class="absolute bg0-block bg-blue-500 w-full h-1/5 top:100 left-full "></div>
      <div class="absolute bg0-block bg-blue-500 w-full h-2/5 top:100 left-full"></div>
      <div class="absolute bg0-block bg-blue-500 w-full h-3/5 top:100 left-full"></div>
      <div class="absolute bg0-block bg-blue-500 w-full h-4/5 top:100 left-full"></div>
      <div class="absolute bg0-block bg-blue-500 w-full h-full top:100 left-full">
        <table   width="100%" height="100%">
          <tr><td align="center" valign="center"><img width="480px" height="680px" src="/static/images/湊あくあ 1.jpg"></td></tr>
        </table>
      </div>
  </div>
  <div class="absolute top-2.2 z-[50] h-full w-full">
    <!-- 五個橘色色塊，依次出現 --> 
    <div class="absolute bg1-block bg-blue-500 w-full h-1/5 top:100 left-full "></div>
    <div class="absolute bg1-block bg-blue-500 w-full h-2/5 top:100 left-full"></div>
    <div class="absolute bg1-block bg-blue-500 w-full h-3/5 top:100 left-full"></div>
    <div class="absolute bg1-block bg-blue-500 w-full h-4/5 top:100 left-full"></div>
    <div class="absolute bg1-block bg-blue-500 w-full h-full top:100 left-full">
      <table   width="100%" height="100%">
        <tr><td align="center" valign="center"><img width="480px" height="680px" src="/static/images/湊あくあ 1.jpg"></td></tr>
      </table>
    </div>
</div>
</section>

<script>
  var altKeyPressed = false;

  $(document).ready(function(){
    // 按下0键时
    $(document).keydown(function(e) {
      if (e.key === "0" && !altKeyPressed) {
        $(".menu").css("display", "block");
        gsap.to("[class^='bg']", {
          left: 0, duration: 0.5, stagger: 0.1, delay: 2
        });
      }
    });

    // 按下Alt键时
    $(document).keydown(function(e) {
      if (e.altKey) {
        altKeyPressed = true;
      }
    });

    // 放开Alt键时
    $(document).keyup(function(e) {
      if (!e.altKey) {
        altKeyPressed = false;
      }
    });

    // 按下1~9键时
    for (let i = 1; i <= 9; i++) {
      $(document).keydown(function(e) {
        if (e.key === i.toString() && !altKeyPressed) {
          $(".menu").css("display", "block");
          gsap.to(".bg" + i + "-block", {
            left: 0, duration: 0.5, stagger: 0.1, delay: 2
          });
        }
      });

      // 按下Alt+1~9键时
      $(document).keydown(function(e) {
        if (altKeyPressed && e.key === i.toString()) {
          gsap.to(".bg" + i + "-block", {
            left: "100%", duration: 0.5, stagger: 0.1
          });
        }
      });
    }
  });
</script>

</body>
</html>
