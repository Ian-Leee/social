      transition: left 0.5s;
    }

</head>
<body>


<section class="menu fixed w-full h-screen top-2.2 hidden">

  <!-- background -->
  <div class="absolute top-2.2 z-[50] h-full w-full">
      <!-- 五個橘色色塊，依次出現 --> 
      <div class="absolute bg-block bg-blue-500 w-full h-1/5 top:100 left-full "></div>
      <div class="absolute bg-block bg-blue-500 w-full h-2/5 top:100 left-full"></div>
      <div class="absolute bg-block bg-blue-500 w-full h-3/5 top:100 left-full"></div>
      <div class="absolute bg-block bg-blue-500 w-full h-4/5 top:100 left-full"></div>
      <div class="absolute bg-block bg-blue-500 w-full h-full top:100 left-full">
        <table   width="100%" height="100%">
          <tr><td align="center" valign="center"><img width="480px" height="680px" src="/static/images/湊あくあ 1.jpg"></td></tr>
        </table>
      </div>
  </div>

  <div class="absolute top-2.2 z-[50] h-full w-full">
    <!-- 五個橘色色塊，依次出現 --> 
    <div class="absolute ba-block bg-blue-500 w-full h-1/5 left-full"></div>
    <div class="absolute ba-block bg-blue-500 w-full h-2/5 left-full"></div>
    <div class="absolute ba-block bg-blue-500 w-full h-3/5 left-full"></div>
    <div class="absolute ba-block bg-blue-500 w-full h-4/5 left-full"></div>
    <div class="absolute ba-block bg-red-500 w-full h-full left-full">
      <table   width="100%" height="100%">
        <tr><td align="center" valign="center"><img width="480px" height="680px" src="/static/images/湊あくあ 1.jpg"></td></tr>
      </table>
    </div>
  </div>
</section>

<script>
  var laFunction = function(){
    gsap.to(".bg-block", {
      left: 3000, duration: 0.5, stagger: 0.1,delay:2
    })
  }

  var altKeyPressed = false;

  $(document).ready(function(){
    // 按下1键时
    $(document).keydown(function(e) {
      if (e.key === "1" && !altKeyPressed) {
        $(".menu").css("display", "block");
        gsap.to(".bg-block", {
          left: 0, duration: 0.5, stagger: 0.1, delay: 2
        });
      }
    });

    // 按下Alt键时
    $(document).keydown(function(e) {
      if (e.altKey) {
        altKeyPressed = true;
      }
    });

    // 放开Alt键时
    $(document).keyup(function(e) {
      if (!e.altKey) {
        altKeyPressed = false;
      }
    });

    // 按下Alt+1键时
    $(document).keydown(function(e) {
      if (altKeyPressed && e.key === "1") {
        gsap.to(".bg-block", {
          left: "100%", duration: 0.5, stagger: 0.1
        });
      }
    });
  });
</script>

</body>
</html>
