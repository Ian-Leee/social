<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const playerImage1 = new Image();
    playerImage1.src = '/static/images/reflect.jpeg';

    const playerImage2 = new Image();
    playerImage2.src = '/static/images/gura.jpeg';

    let playerWidth1, playerHeight1, playerWidth2, playerHeight2;

    playerImage1.onload = function() {
        playerWidth1 = playerImage1.width;
        playerHeight1 = playerImage1.height;
    };

    playerImage2.onload = function() {
        playerWidth2 = playerImage2.width;
        playerHeight2 = playerImage2.height;
    };

    const playerSpeed = 3;

    const player1 = {
        x: canvas.width / 2 - 200,
        y: canvas.height / 2,
        dx: 0,
        dy: 0
    };

    const player2 = {
        x: canvas.width / 2 + 200,
        y: canvas.height / 2,
        dx: 0,
        dy: 0
    };

    // 設置canvas大小為視窗大小
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawPlayer(player, image, width, height) {
        ctx.drawImage(image, player.x, player.y, width, height);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function update() {
        clearCanvas();
        player1.x += player1.dx;
        player1.y += player1.dy;
        player2.x += player2.dx;
        player2.y += player2.dy;
        drawPlayer(player1, playerImage1, playerWidth1, playerHeight1);
        drawPlayer(player2, playerImage2, playerWidth2, playerHeight2);
    }

    window.addEventListener('keydown', function(event) {
        switch (event.key) {
            case 'a':
                player1.dx = -playerSpeed;
                break;
            case 'd':
                player1.dx = playerSpeed;
                break;
            case 'w':
                player1.dy = -playerSpeed;
                break;
            case 's':
                player1.dy = playerSpeed;
                break;
            case 'A':
                player1.dx = -playerSpeed;
                break;
            case 'D':
                player1.dx = playerSpeed;
                break;
            case 'W':
                player1.dy = -playerSpeed;
                break;
            case 'S':
                player1.dy = playerSpeed;
                break;
            case 'ArrowLeft':
                player2.dx = -playerSpeed;
                break;
            case 'ArrowRight':
                player2.dx = playerSpeed;
                break;
            case 'ArrowUp':
                player2.dy = -playerSpeed;
                break;
            case 'ArrowDown':
                player2.dy = playerSpeed;
                break;
        }
    });

    window.addEventListener('keyup', function(event) {
        switch (event.key) {
            case 'a':
            case 'd':
                player1.dx = 0;
                break;
            case 'w':
            case 's':
                player1.dy = 0;
                break;
            case 'A':
            case 'D':
                player1.dx = 0;
                break;
            case 'W':
            case 'S':
                player1.dy = 0;
                break;
            case 'ArrowLeft':
            case 'ArrowRight':
                player2.dx = 0;
                break;
            case 'ArrowUp':
            case 'ArrowDown':
                player2.dy = 0;
                break;
        }
    });

    function gameLoop() {
        update();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
